version: "3.9"

services:
  db:
    image: postgres:15
    container_name: e-classroom
    restart: unless-stopped
    ports:
      - "5433:5432"     # host:container
    environment:
      # these create the initial DB and superuser inside the container
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e-classroomdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d e-classroomdb -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
